name: pixel-profile

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the default branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github stats card
        env:
          CARD_URL: https://pixel-profile-gamma.vercel.app/api/github-stats?username=Chia1104&screen_effect=true&background=linear-gradient(to%20bottom%20right%2C%20%232aeeff%2C%20%235580eb)
        run: |
          mkdir -p dist
          curl -fsSL --retry 5 --retry-delay 2 \
            -o dist/github-stats.png \
            "$CARD_URL"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dist/github-stats.png")
          data = path.read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n" or len(data) < 1024:
              raise SystemExit(
                  f"pixel-profile API did not return a PNG ({len(data)} bytes, prefix={data[:32]!r})"
              )
          print(f"wrote {path} ({len(data)} bytes)")
          PY

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file>
      - name: push github-stats.png to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
